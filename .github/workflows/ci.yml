name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, unit tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: make install

      - name: Run static and build checks
        run: make check

  postgres-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: make install

      - name: Run PostgreSQL integration tests
        run: make postgres-integration

  process-and-browser:
    name: HTTP, WebSocket, and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pong_pong_test
          POSTGRES_USER: pong
          POSTGRES_PASSWORD: pong
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pong -d pong_pong_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://pong:pong@127.0.0.1:5432/pong_pong_test
      API_BASE_URL: http://localhost:4000
      WS_URL: ws://127.0.0.1:4000/ws

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: make install

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build production processes
        run: pnpm build

      - name: Prepare the process-test database
        run: |
          pnpm --filter @pong-pong/db migrate
          pnpm --filter @pong-pong/db seed:dev

      - name: Run process smoke and browser tests
        env:
          APP_MODE: development
          SESSION_SECRET: ci-process-session-secret-32-bytes
          LOG_LEVEL: warn
        run: |
          set -euo pipefail
          node apps/api/dist/index.js >/tmp/pong-api.log 2>&1 &
          API_PID=$!
          pnpm --filter @pong-pong/web start >/tmp/pong-web.log 2>&1 &
          WEB_PID=$!
          cleanup() {
            kill "$API_PID" "$WEB_PID" 2>/dev/null || true
            wait "$API_PID" "$WEB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4000/health/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4000/health/ready >/dev/null

          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000 >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000 >/dev/null

          make smoke
          make e2e

      - name: Upload process logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: process-and-browser-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/pong-api.log
            /tmp/pong-web.log
          if-no-files-found: ignore
          retention-days: 7

  guest-demo-browser:
    name: Guest demo browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_MODE: demo
      E2E_APP_MODE: demo
      E2E_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_MODE: demo
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      SESSION_SECRET: ci-guest-demo-session-secret-32-bytes
      LOG_LEVEL: warn

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: make install

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build demo processes
        run: pnpm build

      - name: Run tests/e2e/guest-demo.spec.ts
        run: |
          set -euo pipefail
          node apps/api/dist/index.js >/tmp/pong-demo-api.log 2>&1 &
          API_PID=$!
          pnpm --filter @pong-pong/web start >/tmp/pong-demo-web.log 2>&1 &
          WEB_PID=$!
          cleanup() {
            kill "$API_PID" "$WEB_PID" 2>/dev/null || true
            wait "$API_PID" "$WEB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if curl --fail --silent http://localhost:4000/health/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:4000/health/ready >/dev/null

          for _ in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000 >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:3000 >/dev/null

          make e2e-guest-demo

      - name: Upload process logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guest-demo-browser-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/pong-demo-api.log
            /tmp/pong-demo-web.log
          if-no-files-found: ignore
          retention-days: 7

  production-compose:
    name: Production Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-production-compose-password
      SESSION_SECRET: ci-production-compose-session-secret-32-bytes

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Start the production stack
        run: docker compose up --build --wait --wait-timeout 600

      - name: Verify the public health endpoint
        run: curl --fail --silent http://localhost:8080/api/health/ready

      - name: Verify metrics stay internal
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/api/metrics)
          test "$status" = "404"

      - name: Stop the production stack
        if: always()
        run: docker compose down --volumes --remove-orphans
